.head{text-align:center;margin-bottom:28px}

.sec{letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin:22px 0 6px;font-size:12px;font-weight:600}

.row span:last-child{white-space:nowrap;font-feature-settings:"tnum" 1}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;opacity:.65;

.total{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:12px 0;margin-top:10px;

.total span:last-child{color:var(--accent);font-feature-settings:"tnum" 1}
.footer{white-space:pre-line;font-size:12.5px;line-height:1.6;opacity:.55;margin:8px 0 0}
.notice{margin:0 0 8px;font-size:13.5px;line-height:1.6;opacity:.78}
